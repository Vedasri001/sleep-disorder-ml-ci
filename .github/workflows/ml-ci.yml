name: Sleep Disorder ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Train sleep disorder model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest discover -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp sleep_disorder_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf "Sleep Disorder Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt


      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: sleep-disorder-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sleep-disorder-ml-artifact
          path: |
            sleep_disorder_model.pkl
            metrics.json
            sleep_dataset_processed.csv
          if-no-files-found: error
          retention-days: 7

     
      - name: Build Docker image
        run: docker build -t sleep-disorder-ml:${{ github.sha }} .

      
      - name: Start Docker container
        run: |
          docker run -d \
            --name sleep-disorder-ml-container \
            -p 5000:5000 \
            sleep-disorder-ml:${{ github.sha }}

      

      
      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          echo "Application did not become ready."
          docker logs sleep-disorder-ml-container
          exit 1

     
      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "Gender": "Male",
              "Age": 30,
              "Occupation": "Software Engineer",
              "Sleep Duration": 7.0,
              "Quality of Sleep": 7,
              "Physical Activity Level": 60,
              "Stress Level": 5,
              "BMI Category": "Normal",
              "Heart Rate": 70,
              "Daily Steps": 7000,
              "Systolic BP": 120,
              "Diastolic BP": 80
            }' \
            http://localhost:5000/predict)
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

       
      - name: Show Docker container logs
        if: always()
        run: docker logs sleep-disorder-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f sleep-disorder-ml-container || true




